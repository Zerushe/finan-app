const Icon = ({ name, size = 20, className = '', strokeWidth = 1.8 }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const iconFn = lucide[name];
      if (iconFn) {
        const el = document.createElement('span');
        el.innerHTML = lucide.createElement(iconFn, { width: size, height: size, strokeWidth }).outerHTML;
        ref.current.appendChild(el.firstChild);
      }
    }
  }, [name, size, strokeWidth]);
  return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} />;
};

// ─────────────────────────────────────────────
// UTILITIES
// ─────────────────────────────────────────────
const fmt = (v, opts = {}) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', ...opts }).format(v || 0);
const fmtPct = (v) => `${(v || 0).toFixed(2)}%`;
const today = () => new Date().toISOString().split('T')[0];
const monthKey = (d) => d.slice(0, 7);
const currentMonth = () => today().slice(0, 7);
const monthLabel = (ym) => {
  if (!ym) return '';
  const [y, m] = ym.split('-');
  return new Date(+y, +m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
};

const defaultDateForMonth = (ym) => (ym === currentMonth() ? today() : `${ym}-01`);

const despesaAtivaNoMes = (d, ym) => {
  if ((d.meses_excluidos || []).includes(ym)) return false;
  if (d.frequencia === 'Única') return d.mes_inicio === ym;
  return !d.mes_inicio || d.mes_inicio <= ym;
};

const shiftMonth = (ym, n) => {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
};
const monthShort = (ym) => {
  if (!ym) return '';
  const [y, m] = ym.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
};

const mesFatura = (dataStr, card) => {
  if (!card) return monthKey(dataStr);
  const dia = Number(dataStr.slice(8, 10));
  let n = dia >= Number(card.dia_fechamento) ? 1 : 0;
  if (Number(card.dia_vencimento) <= Number(card.dia_fechamento)) n += 1;
  return shiftMonth(monthKey(dataStr), n);
};

const mesDaTransacao = (t, cartoes) => {
  if (t.mes_fatura) return t.mes_fatura;
  const card = (cartoes || []).find(c => c.id === t.forma_pagamento_id);
  return card ? mesFatura(t.data, card) : monthKey(t.data);
};

// ─────────────────────────────────────────────
// CONTEXT
// ─────────────────────────────────────────────
const AppContext = createContext(null);

function normalizeData(p) {
  if (!p || typeof p !== 'object') return null;
  const merged = { ...INITIAL_DATA, ...p };
  for (const k of Object.keys(INITIAL_DATA)) {
    if (Array.isArray(INITIAL_DATA[k]) && !Array.isArray(merged[k])) merged[k] = INITIAL_DATA[k];
  }
  return merged;
}

function AppProvider({ children }) {
  const stored = (() => {
    try {
      const s = localStorage.getItem('finanapp_data');
      return s ? normalizeData(JSON.parse(s)) : null;
    } catch { return null; }
  })();
  const [data, setData] = useState(stored || INITIAL_DATA);
  const [selectedMonth, setSelectedMonth] = useState(currentMonth());

  useEffect(() => {
    try { localStorage.setItem('finanapp_data', JSON.stringify(data)); } catch {}
  }, [data]);

  const update = useCallback((key, fn) => setData(d => ({ ...d, [key]: fn(d[key]) })), []);

  const addItem = useCallback((key, item) => update(key, arr => [...(arr || []), { ...item, id: item.id || uid() }]), [update]);
  const editItem = useCallback((key, item) => update(key, arr => (arr || []).map(x => x.id === item.id ? item : x)), [update]);
  const deleteItem = useCallback((key, id) => update(key, arr => (arr || []).filter(x => x.id !== id)), [update]);
  const updateSaldo = useCallback((v) => setData(d => ({ ...d, saldo_conta: v })), []);

  const removeLancamentoInvestimento = useCallback((id) => {
    setData(d => {
      const l = (d.lancamentos_investimento || []).find(x => x.id === id);
      if (!l) return d;
      const delta = l.tipo === 'aporte' ? -l.valor : l.valor;
      return {
        ...d,
        investimentos: d.investimentos.map(i => i.id === l.investimento_id ? { ...i, valor_atual: Math.max(0, i.valor_atual + delta) } : i),
        lancamentos_investimento: d.lancamentos_investimento.filter(x => x.id !== id),
      };
    });
  }, []);

  const payFatura = useCallback((cartaoId, mes, valor) => {
    setData(d => {
      const card = d.cartoes.find(c => c.id === cartaoId);
      const cardName = card ? card.nome_cartao : 'Cartão';
      const transacaoId = uid();
      
      const novoLancamento = {
        id: transacaoId,
        descricao: `Pagamento Fatura - ${cardName}`,
        valor: valor,
        data: today(),
        mes_fatura: mes,
        categoria: 'outros',
        forma_pagamento_id: 'pix',
        tipo: 'Pagamento de Fatura',
        cartao_id: cartaoId,
      };

      const novoRegistro = {
        id: uid(),
        cartao_id: cartaoId,
        mes: mes,
        valor_pago: valor,
        data_pagamento: today(),
        transacao_id: transacaoId,
      };

      const cartoesAtualizados = d.cartoes.map(c =>
        c.id === cartaoId ? { ...c, limite_usado: Math.max(0, c.limite_usado - valor) } : c
      );

      return {
        ...d,
        cartoes: cartoesAtualizados,
        transacoes: [novoLancamento, ...d.transacoes],
        faturas_pagas: [...(d.faturas_pagas || []).filter(f => !(f.cartao_id === cartaoId && f.mes === mes)), novoRegistro],
      };
    });
  }, []);

  const undoPayFatura = useCallback((cartaoId, mes) => {
    setData(d => {
      const reg = (d.faturas_pagas || []).find(f => f.cartao_id === cartaoId && f.mes === mes);
      if (!reg) return d;
      const valorReverter = reg.valor_pago || 0;
      const transacaoId = reg.transacao_id;

      const cartoesAtualizados = d.cartoes.map(c =>
        c.id === cartaoId ? { ...c, limite_usado: c.limite_usado + valorReverter } : c
      );

      return {
        ...d,
        cartoes: cartoesAtualizados,
        transacoes: d.transacoes.filter(t => t.id !== transacaoId && !(t.tipo === 'Pagamento de Fatura' && t.cartao_id === cartaoId && t.mes_fatura === mes)),
        faturas_pagas: (d.faturas_pagas || []).filter(f => !(f.cartao_id === cartaoId && f.mes === mes)),
      };
    });
  }, []);

  const exportData = useCallback(() => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'finanapp_backup.json'; a.click();
    URL.revokeObjectURL(url);
  }, [data]);

  const importData = useCallback((file) => {
    const reader = new FileReader();
    reader.onload = (e) => { try { const n = normalizeData(JSON.parse(e.target.result)); if (!n) throw new Error('invalid'); setData(n); } catch { alert('Arquivo inválido.'); } };
    reader.readAsText(file);
  }, []);

  const exportCSV = useCallback(() => {
    const rows = [['Tipo','Descrição','Valor','Data','Categoria','Pagamento']];
    data.transacoes.forEach(t => rows.push([t.tipo, t.descricao, t.valor, t.data, t.categoria, t.forma_pagamento_id]));
    data.receitas.forEach(r => rows.push(['Receita', r.descricao, r.valor, r.data_recebimento, r.categoria, '']));
    data.despesas_fixas.forEach(d => rows.push(['Despesa Fixa', d.descricao, d.valor, d.mes_inicio || '', d.categoria, d.forma_pagamento]));

    const csv = rows.map(r => r.join(';')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'finanapp_transacoes.csv'; a.click();
    URL.revokeObjectURL(url);
  }, [data]);

  const computeds = useMemo(() => {
    const { receitas, despesas_fixas, transacoes, cartoes, investimentos, faturas_pagas } = data;

    const faturasPagasSet = new Set((faturas_pagas || []).map(f => `${f.cartao_id}_${f.mes}`));

    const receitasMes = receitas
      .filter(r => !(r.meses_excluidos || []).includes(selectedMonth))
      .filter(r => r.frequencia === 'Mensal Recorrente'
        ? monthKey(r.data_recebimento) <= selectedMonth
        : monthKey(r.data_recebimento) === selectedMonth)
      .map(r => {
        const registro = (data.receitas_mes || []).find(x => x.receita_id === r.id && x.mes === selectedMonth);
        const legadoAtual = selectedMonth === currentMonth() && r.recebido;
        return { ...r, registro: registro || (legadoAtual ? { recebido: true, valor_recebido: r.valor } : null) };
      });
    const totalReceitaPrevista = receitasMes.reduce((s, r) => s + r.valor, 0);
    const totalReceitaRecebida = receitasMes.reduce((s, r) => s + (r.registro?.recebido ? (r.registro.valor_recebido ?? r.valor) : 0), 0);

    const despesasFixasMes = despesas_fixas.filter(d => despesaAtivaNoMes(d, selectedMonth)).map(d => {
      const registro = (data.despesas_fixas_mes || []).find(x => x.despesa_id === d.id && x.mes === selectedMonth);
      const legadoAtual = selectedMonth === currentMonth() && d.status_pagamento === 'Pago';
      return { ...d, registro: registro || (legadoAtual ? { pago: true, valor_pago: d.valor } : null) };
    });
    const totalFixasPrevisto = despesasFixasMes.reduce((s, d) => s + d.valor, 0);
    const totalFixasPagas = despesasFixasMes.reduce((s, d) => s + (d.registro?.pago ? d.registro.valor_pago : 0), 0);

    const transacoesMes = transacoes.filter(t => mesDaTransacao(t, cartoes) === selectedMonth);

    const transacoesEfetivas = transacoesMes.filter(t => {
      if (t.tipo === 'Crédito') {
        const faturaChave = `${t.forma_pagamento_id}_${selectedMonth}`;
        if (faturasPagasSet.has(faturaChave)) {
          return false;
        }
      }
      return true;
    });

    const totalEventuais = transacoesEfetivas.reduce((s, t) => s + t.valor, 0);

    const lancamentosInvestimentoMes = (data.lancamentos_investimento || []).filter(x => monthKey(x.data) === selectedMonth);
    const totalAportesMes = lancamentosInvestimentoMes.filter(x => x.tipo === 'aporte').reduce((s, x) => s + x.valor, 0);
    const totalResgatesMes = lancamentosInvestimentoMes.filter(x => x.tipo === 'resgate').reduce((s, x) => s + x.valor, 0);
    const totalInvestido = investimentos.reduce((s, i) => s + i.valor_atual, 0);

    const lancamentosInicioMes = lancamentosInvestimentoMes.filter(x => x.lancar_inicio !== false);
    const aportesNoInicio = lancamentosInicioMes.filter(x => x.tipo === 'aporte').reduce((s, x) => s + x.valor, 0);
    const resgatesNoInicio = lancamentosInicioMes.filter(x => x.tipo === 'resgate').reduce((s, x) => s + x.valor, 0);

    const balanco = totalReceitaRecebida - totalFixasPagas - totalEventuais - aportesNoInicio + resgatesNoInicio;

    return {
      faturasPagasSet,
      receitasMes, totalReceitaPrevista, totalReceitaRecebida,
      despesasFixasMes, totalFixasPrevisto, totalFixasPagas,
      transacoesMes, transacoesEfetivas, totalEventuais,
      balanco, lancamentosInvestimentoMes, totalAportesMes, totalResgatesMes, totalInvestido,
      lancamentosInicioMes, aportesNoInicio, resgatesNoInicio,
    };
  }, [data, selectedMonth]);

  return (
    <AppContext.Provider value={{ data, update, addItem, editItem, deleteItem, updateSaldo, removeLancamentoInvestimento, payFatura, undoPayFatura, exportData, exportCSV, importData, selectedMonth, setSelectedMonth, computeds }}>
      {children}
    </AppContext.Provider>
  );
}

// DONUT CHART
// ─────────────────────────────────────────────
function DonutChart({ data: segments, size = 160, strokeWidth = 24 }) {
  const r = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * r;
  const total = segments.reduce((s, d) => s + d.value, 0);
  let offset = 0;

  return (
    <div className="relative inline-flex items-center justify-center" style={{ width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1e293b" strokeWidth={strokeWidth} />
        {segments.map((seg, i) => {
          const pct = total > 0 ? seg.value / total : 0;
          const dash = pct * circumference;
          const gap = circumference - dash;
          const el = (
            <circle key={i} cx={size/2} cy={size/2} r={r} fill="none"
              stroke={seg.color} strokeWidth={strokeWidth}
              strokeDasharray={`${dash} ${gap}`}
              strokeDashoffset={-offset}
              strokeLinecap="round"
              className="donut-ring"
            />
          );
          offset += dash;
          return el;
        })}
      </svg>
      <div className="absolute text-center">
        <p className="text-xs text-slate-400">Total</p>
        <p className="text-base font-bold text-slate-100 leading-tight">{fmt(total).replace('R$\u00A0', 'R$\n')}</p>
      </div>
    </div>
  );
}

function addMonths(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1 + n, d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(Math.min(d, new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate())).padStart(2,'0')}`;
}

function QuickAddModal({ open, onClose }) {
  const { data, addItem, editItem } = useApp();
  const [form, setForm] = useState({ valor: '', descricao: '', categoria: '', forma_pagamento_id: 'pix', data: today(), tipo: 'Débito', parcelas: 1 });

  const isCard = !['pix', 'dinheiro', 'debito'].includes(form.forma_pagamento_id);
  const cardSel = isCard ? data.cartoes.find(c => c.id === form.forma_pagamento_id) : null;

  const reset = () => setForm({ valor: '', descricao: '', categoria: '', forma_pagamento_id: 'pix', data: today(), tipo: 'Débito', parcelas: 1 });
  const handleClose = () => { reset(); onClose(); };

  const handlePayment = (id) => {
    const willBeCard = !['pix', 'dinheiro', 'debito'].includes(id);
    setForm(f => ({ ...f, forma_pagamento_id: id, parcelas: willBeCard ? f.parcelas : 1 }));
  };

  const handleSave = () => {
    if (!form.valor || !form.categoria) return;
    const tipo = isCard ? 'Crédito' : form.tipo;
    const totalValor = parseFloat(form.valor);
    const n = isCard ? (form.parcelas || 1) : 1;
    const valorParcela = parseFloat((totalValor / n).toFixed(2));
    const descBase = form.descricao || 'Lançamento';
    const baseFatura = mesFatura(form.data, cardSel);

    for (let i = 0; i < n; i++) {
      const dataParcela = addMonths(form.data, i);
      const descParcela = n > 1 ? `${descBase} (${i+1}/${n})` : descBase;
      const valorFinal = i === n - 1 ? parseFloat((totalValor - valorParcela * (n-1)).toFixed(2)) : valorParcela;
      addItem('transacoes', {
        descricao: descParcela,
        valor: valorFinal,
        data: dataParcela,
        mes_fatura: isCard ? shiftMonth(baseFatura, i) : undefined,
        categoria: form.categoria,
        forma_pagamento_id: form.forma_pagamento_id,
        tipo,
        parcela_atual: n > 1 ? i + 1 : undefined,
        total_parcelas: n > 1 ? n : undefined,
      });
    }

    if (isCard) {
      const card = data.cartoes.find(c => c.id === form.forma_pagamento_id);
      if (card) editItem('cartoes', { ...card, limite_usado: card.limite_usado + totalValor });
    }
    handleClose();
  };

  const numPad = ['1','2','3','4','5','6','7','8','9','.','0','⌫'];
  const handleNum = (n) => {
    setForm(f => {
      let v = f.valor;
      if (n === '⌫') v = v.slice(0, -1);
      else if (n === '.' && v.includes('.')) return f;
      else v = v + n;
      return { ...f, valor: v };
    });
  };

  const paymentOptions = [
    ...PAYMENT_METHODS,
    ...data.cartoes.map(c => ({ id: c.id, label: c.nome_cartao, icon: 'CreditCard', color: 'text-violet-400' })),
  ];

  const totalValor = parseFloat(form.valor) || 0;
  const valorParcela = isCard && form.parcelas > 1 ? (totalValor / form.parcelas).toFixed(2) : null;

  if (!open) return null;

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" style={{ background: 'rgba(0,0,0,0.8)', backdropFilter: 'blur(6px)' }}>
      <div onClick={handleClose} className="absolute inset-0" />
      <div className="modal-content relative w-full bg-slate-900 rounded-t-3xl border-t border-slate-700/50 shadow-2xl overflow-y-auto" style={{ maxWidth: '480px', maxHeight: '95vh' }}>
        <div className="flex items-center justify-between px-5 pt-5 pb-3">
          <div className="w-10 h-1 bg-slate-700 rounded-full absolute left-1/2 -translate-x-1/2 top-2" />

          <button onClick={handleClose} className="w-8 h-8 bg-slate-800 rounded-full flex items-center justify-center"><Icon name="X" size={16} className="text-slate-400" /></button>
        </div>

        <div className="px-5 pb-2 text-center">
          <div className="text-4xl font-black text-slate-100 tracking-tight min-h-[48px]">
            {form.valor ? fmt(totalValor) : <span className="text-slate-600">R$ 0,00</span>}
          </div>
          {valorParcela && (
            <div className="mt-1 inline-flex items-center gap-1.5 px-3 py-1 bg-violet-500/10 border border-violet-500/20 rounded-full">
              <Icon name="Scissors" size={12} className="text-violet-400" />

            </div>

          <div className="px-4 pb-3">

        <div className="px-4 pb-2">
          <div className="grid grid-cols-3 gap-2">
            {numPad.map(n => (

        </div>

          <button onClick={handleSave} disabled={!form.valor || !form.categoria}

              : 'Registrar Gasto'
            }
          </button>
        </div>
      </div>
    </div>
  );

  const { data, addItem, editItem } = useApp();
  const [form, setForm] = useState({});

  useEffect(() => {
    setForm(item || { valor: '', descricao: '', categoria: 'outros', forma_pagamento_id: 'pix', data: today(), tipo: 'Débito', parcelas: 1 });
  }, [item, open]);

  const isCard = !['pix', 'dinheiro', 'debito'].includes(form.forma_pagamento_id || 'pix');
  const cardSel = isCard ? data.cartoes.find(c => c.id === form.forma_pagamento_id) : null;
  const isEditing = !!item?.id;

  const handlePayment = (e) => {
    const id = e.target.value;
    const willBeCard = !['pix', 'dinheiro', 'debito'].includes(id);
    setForm(f => ({ ...f, forma_pagamento_id: id, parcelas: willBeCard ? (f.parcelas || 1) : 1 }));
  };

  const handleSave = () => {
    const totalValor = parseFloat(form.valor);
    if (!totalValor) return;
    const tipo = isCard ? 'Crédito' : (form.tipo || 'Débito');
    const n = (isCard && !isEditing) ? (form.parcelas || 1) : 1;
    const valorParcela = parseFloat((totalValor / n).toFixed(2));
    const descBase = form.descricao || 'Lançamento';
    const baseFatura = mesFatura(form.data || today(), cardSel);

    if (isEditing) {
      editItem('transacoes', { ...form, valor: totalValor, tipo, mes_fatura: isCard ? baseFatura : undefined });
    } else {
      for (let i = 0; i < n; i++) {
        const dataParcela = addMonths(form.data || today(), i);
        const descParcela = n > 1 ? `${descBase} (${i+1}/${n})` : descBase;
        const valorFinal = i === n - 1 ? parseFloat((totalValor - valorParcela * (n-1)).toFixed(2)) : valorParcela;
        addItem('transacoes', {
          descricao: descParcela,
          valor: valorFinal,
          data: dataParcela,
          mes_fatura: isCard ? shiftMonth(baseFatura, i) : undefined,
          categoria: form.categoria || 'outros',
          forma_pagamento_id: form.forma_pagamento_id || 'pix',
          tipo,
          parcela_atual: n > 1 ? i + 1 : undefined,
          total_parcelas: n > 1 ? n : undefined,
        });
      }
      if (isCard) {
        const card = data.cartoes.find(c => c.id === form.forma_pagamento_id);
        if (card) editItem('cartoes', { ...card, limite_usado: card.limite_usado + totalValor });
      }
    }
    onClose();
  };

  const paymentOptions = [
    ...PAYMENT_METHODS,
    ...data.cartoes.map(c => ({ id: c.id, label: c.nome_cartao })),
  ];

  const totalValor = parseFloat(form.valor) || 0;
  const valorParcela = isCard && (form.parcelas || 1) > 1 ? (totalValor / form.parcelas).toFixed(2) : null;

  return (
    <Modal open={open} onClose={onClose} title={isEditing ? 'Editar Transação' : 'Nova Transação'}>
      <div className="p-5 space-y-4">
        <Field label="Descrição">
          <Input value={form.descricao || ''} onChange={e => setForm(f => ({ ...f, descricao: e.target.value }))} placeholder="Ex: iFood, Uber" />
        </Field>

        <Field label="Valor Total (R$)">
          <Input type="number" step="0.01" value={form.valor || ''} onChange={e => setForm(f => ({ ...f, valor: e.target.value }))} placeholder="0,00" />
          {valorParcela && (
            <div className="mt-2 flex items-center gap-2 px-3 py-2 bg-violet-500/10 border border-violet-500/20 rounded-xl">
              <Icon name="Scissors" size={13} className="text-violet-400" />
              <span className="text-xs font-semibold text-violet-400">
                {form.parcelas}x de {fmt(parseFloat(valorParcela))} — Total {fmt(totalValor)}
              </span>
            </div>
          )}
        </Field>

        <div className="grid grid-cols-2 gap-3">
          <Field label="Data da Compra">
            <Input type="date" value={form.data || today()} onChange={e => setForm(f => ({ ...f, data: e.target.value }))} />
          </Field>
          {!isCard && (
            <Field label="Tipo">
              <Select value={form.tipo || 'Débito'} onChange={e => setForm(f => ({ ...f, tipo: e.target.value }))}>
                <option>Débito</option>
                <option>Crédito</option>
              </Select>
            </Field>
          )}
        </div>

        <Field label="Categoria">
          <div className="flex flex-wrap gap-2 mt-1">
            {CATEGORIES.map(cat => (
              <button key={cat.id} onClick={() => setForm(f => ({ ...f, categoria: cat.id }))}
                className={`flex items-center gap-1 px-2.5 py-1 rounded-full text-xs border transition-all
                  ${form.categoria === cat.id ? 'bg-violet-600 border-violet-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                <Icon name={cat.icon} size={10} /> {cat.label}
              </button>
            ))}
          </div>
        </Field>

        <Field label="Forma de Pagamento">
          <Select value={form.forma_pagamento_id || 'pix'} onChange={handlePayment}>
            {paymentOptions.map(pm => <option key={pm.id} value={pm.id}>{pm.label}</option>)}
          </Select>
        </Field>

        {isCard && !isEditing && (
          <Field label="">
            <InstallmentSelector value={form.parcelas || 1} onChange={n => setForm(f => ({ ...f, parcelas: n }))} />
          </Field>
        )}

        <button onClick={handleSave}
          className="w-full py-3 rounded-xl bg-violet-600 text-white font-semibold text-sm active:scale-95 transition-transform mt-2">
          {isEditing
            ? 'Salvar Alterações'
            : isCard && (form.parcelas || 1) > 1
              ? `Parcelar ${form.parcelas}x · ${fmt(parseFloat((totalValor/(form.parcelas||1)).toFixed(2)))}/mês`
              : 'Adicionar Transação'
          }
        </button>
      </div>
    </Modal>
  );
}

function DashboardScreen({ onAddTransaction, onNavigate }) {
  const { data, computeds, selectedMonth, setSelectedMonth, deleteItem, removeLancamentoInvestimento } = useApp();
  const {
    totalReceitaPrevista, totalReceitaRecebida, totalFixasPrevisto, totalFixasPagas, totalEventuais, balanco,
    totalAportesMes, totalResgatesMes, totalInvestido, transacoesMes, lancamentosInicioMes, aportesNoInicio, resgatesNoInicio,
  } = computeds;

  const [search, setSearch] = useState('');
  const [editTx, setEditTx] = useState(null);
  const [deletingId, setDeletingId] = useState(null);
  const [deletingInvId, setDeletingInvId] = useState(null);

  const invNome = (l) => data.investimentos.find(i => i.id === l.investimento_id)?.nome || l.investimento_nome || 'Investimento';

  const q = search.toLowerCase();
  const feed = [
    ...transacoesMes
      .filter(t => t.descricao.toLowerCase().includes(q) || (CAT_MAP[t.categoria]?.label || '').toLowerCase().includes(q))
      .map(t => ({ kind: 'tx', id: t.id, data: t.data, t })),
    ...lancamentosInicioMes
      .filter(l => `${l.tipo} ${invNome(l)} investimento`.toLowerCase().includes(q))
      .map(l => ({ kind: 'inv', id: l.id, data: l.data, l })),
  ].sort((a, b) => b.data.localeCompare(a.data));

  const isPositive = balanco >= 0;
  const guardadoNoMes = aportesNoInicio - resgatesNoInicio;
  const liquidoMes = totalAportesMes - totalResgatesMes;

  return (
    <div className="pb-28 px-4 pt-4 space-y-5">
      <div className="flex items-start justify-between">
        <div>
          <p className="text-slate-400 text-sm">Olá, bem-vindo 👋</p>
          <h1 className="text-xl font-bold text-slate-100">Visão geral</h1>
        </div>
        <MonthSelector value={selectedMonth} onChange={setSelectedMonth} />
      </div>

      <div className="grid grid-cols-2 gap-3">
        <SummaryCard title="Receita do Mês" value={fmt(totalReceitaRecebida)} sub={fmt(totalReceitaPrevista)} subLabel="Previsto" icon="TrendingUp" color="text-emerald-400" bgColor="bg-emerald-500/10" />
        <SummaryCard title="Despesas Fixas" value={fmt(totalFixasPagas)} sub={fmt(totalFixasPrevisto)} subLabel="Total" icon="Receipt" color="text-amber-400" bgColor="bg-amber-500/10" />
        <SummaryCard title="Gastos Eventuais" value={fmt(totalEventuais)} sub={transacoesMes.length} subLabel="Transações" icon="ShoppingBag" color="text-rose-400" bgColor="bg-rose-500/10" />
        <SummaryCard title="Guardado" value={fmt(totalInvestido)} sub={`${liquidoMes >= 0 ? '+' : '-'}${fmt(Math.abs(liquidoMes))}`} subLabel="No mês" icon="PiggyBank" color="text-violet-400" bgColor="bg-violet-500/10" onClick={() => onNavigate('investments')} />
        <Card className="col-span-2">
          <div className="flex items-start justify-between mb-3">
            <p className="text-xs text-slate-400 font-medium uppercase tracking-wide">Balanço</p>
            <div className={`w-8 h-8 rounded-xl flex items-center justify-center ${isPositive ? 'bg-emerald-500/10' : 'bg-rose-500/10'}`}>
              <Icon name={isPositive ? 'TrendingUp' : 'TrendingDown'} size={15} className={isPositive ? 'text-emerald-400' : 'text-rose-400'} />
            </div>
          </div>
          <p className={`text-xl font-bold leading-none ${isPositive ? 'text-emerald-400' : 'text-rose-400'}`}>{fmt(balanco)}</p>
          <p className="text-xs text-slate-500 mt-2">
            {isPositive ? 'Superávit ✓' : 'Déficit ⚠️'}
            {guardadoNoMes !== 0 && ` · já considera ${fmt(Math.abs(guardadoNoMes))} ${guardadoNoMes > 0 ? 'guardados' : 'resgatados'} em investimentos`}
          </p>
        </Card>
      </div>

      <div>
        <div className="flex items-center justify-between mb-3">
          <h2 className="text-sm font-bold text-slate-200">Transações Recentes</h2>
          <button onClick={onAddTransaction} className="text-xs text-violet-400 font-semibold">+ Nova</button>
        </div>

        <div className="relative mb-3">
          <Icon name="Search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
          <input
            value={search}
            onChange={e => setSearch(e.target.value)}
            placeholder="Buscar transações..."
            className="w-full bg-slate-800/60 border border-slate-700/50 rounded-xl pl-8 pr-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-violet-500"
          />
        </div>

        <Card className="divide-y-0 p-0 overflow-hidden">
          <div className="px-4">
            {feed.length === 0 ? (
              <div className="py-8 text-center text-slate-500 text-sm">
                <Icon name="Inbox" size={32} className="mx-auto mb-2 text-slate-700" />
                Nenhuma transação neste período
              </div>
            ) : (
              feed.slice(0, 20).map(item => item.kind === 'tx' ? (
                <TransactionItem key={item.id} t={item.t} onEdit={setEditTx} onDelete={setDeletingId} />
              ) : (
                <InvestmentFeedItem key={item.id} l={item.l} nome={invNome(item.l)} onDelete={setDeletingInvId} />
              ))
            )}
          </div>
        </Card>
      </div>

      <TransactionModal open={!!editTx} onClose={() => setEditTx(null)} item={editTx} />
      <ConfirmDialog open={!!deletingId} message="Excluir esta transação?" onConfirm={() => { deleteItem('transacoes', deletingId); setDeletingId(null); }} onCancel={() => setDeletingId(null)} />
      <ConfirmDialog open={!!deletingInvId} message="Excluir este lançamento? O valor será revertido no investimento." onConfirm={() => { removeLancamentoInvestimento(deletingInvId); setDeletingInvId(null); }} onCancel={() => setDeletingInvId(null)} />
    </div>
  );
}

          </Field>

          <Field label="Limite Usado Atual (R$)"><Input type="number" value={form.limite_usado || ''} onChange={e => setForm(f => ({ ...f, limite_usado: e.target.value }))} placeholder="0" /></Field>

function CreditCardsScreen() {
  const { data, deleteItem, payFatura, undoPayFatura, selectedMonth, setSelectedMonth, computeds } = useApp();
  const [selectedCardIdx, setSelectedCardIdx] = useState(0);
  const [editCard, setEditCard] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [deletingId, setDeletingId] = useState(null);
  
  const [confirmPay, setConfirmPay] = useState(null);
  const [confirmUndo, setConfirmUndo] = useState(null);

  const cards = data.cartoes;
  const card = cards[selectedCardIdx] || cards[0];

  const cardMonthTx = useMemo(() => {
    if (!card) return [];
    return data.transacoes
      .filter(t => t.forma_pagamento_id === card.id && mesDaTransacao(t, data.cartoes) === selectedMonth)
      .sort((a, b) => b.data.localeCompare(a.data));
  }, [card, data.transacoes, data.cartoes, selectedMonth]);

  const totalFaturaMes = useMemo(() => {
    return cardMonthTx.reduce((s, t) => s + t.valor, 0);
  }, [cardMonthTx]);

  const isPaga = useMemo(() => {
    if (!card) return false;
    return computeds.faturasPagasSet.has(`${card.id}_${selectedMonth}`);
  }, [card, selectedMonth, computeds.faturasPagasSet]);

  const regPaga = useMemo(() => {
    if (!card || !isPaga) return null;
    return (data.faturas_pagas || []).find(f => f.cartao_id === card.id && f.mes === selectedMonth);
  }, [card, isPaga, selectedMonth, data.faturas_pagas]);

  const handleConfirmPay = () => {
    if (!confirmPay) return;
    payFatura(confirmPay.cartao.id, confirmPay.mes, confirmPay.valor);
    setConfirmPay(null);
  };

  const handleConfirmUndo = () => {
    if (!confirmUndo) return;
    undoPayFatura(confirmUndo.cartao.id, confirmUndo.mes);
    setConfirmUndo(null);
  };

  if (cards.length === 0) return (
    <div className="flex flex-col items-center justify-center h-64 text-slate-500 gap-3">
      <Icon name="CreditCard" size={48} className="text-slate-700" />
      <p className="text-sm">Nenhum cartão cadastrado</p>
      <button onClick={() => setShowAdd(true)} className="px-4 py-2 bg-violet-600 text-white rounded-xl text-sm font-semibold">+ Adicionar Cartão</button>
      <CardModal open={showAdd} onClose={() => setShowAdd(false)} item={null} />
    </div>
  );

  return (
    <div className="pb-28 pt-4">
      <div className="px-4 mb-4 flex items-center justify-between">
        <div>
          <h1 className="text-lg font-bold text-slate-100">Cartões de Crédito</h1>
          <p className="text-xs text-slate-500">Gestão de limites e faturas por mês</p>
        </div>
        <button onClick={() => setShowAdd(true)} className="px-3 py-1.5 bg-violet-600/20 border border-violet-500/30 text-violet-400 rounded-xl text-xs font-semibold">+ Novo Cartão</button>
      </div>

      <div className="px-4 mb-4">
        <div className="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-2.5 flex items-center justify-between">
          <span className="text-xs font-semibold text-slate-400 uppercase tracking-wide">Mês da Fatura:</span>
          <MonthSelector value={selectedMonth} onChange={setSelectedMonth} />
        </div>
      </div>

      <div className="px-4 mb-5">
        <div className="overflow-x-auto flex gap-3 pb-2 snap-x snap-mandatory scrollbar-none" style={{ scrollbarWidth: 'none' }}>
          {cards.map((c, i) => {
            const usedPct = c.limite_total > 0 ? (c.limite_usado / c.limite_total) * 100 : 0;
            const cardPaga = computeds.faturasPagasSet.has(`${c.id}_${selectedMonth}`);
            return (
              <div key={c.id} onClick={() => setSelectedCardIdx(i)}
                className="snap-center flex-shrink-0 w-72 rounded-2xl p-5 cursor-pointer relative overflow-hidden transition-all active:scale-95"
                style={{ background: `linear-gradient(135deg, ${c.cor_identificadora}dd, ${c.cor_identificadora}88)`, border: selectedCardIdx === i ? '2px solid rgba(255,255,255,0.4)' : '2px solid transparent' }}>
                <div className="absolute top-0 right-0 w-32 h-32 rounded-full opacity-20" style={{ background: 'radial-gradient(circle, white, transparent)', transform: 'translate(30%,-30%)' }} />
                
                <div className="flex justify-between items-start mb-6">
                  <div>
                    <p className="text-white/70 text-xs font-medium uppercase tracking-wider">{c.bandeira}</p>
                    <p className="text-white font-bold text-base mt-0.5">{c.nome_cartao}</p>
                  </div>
                  <div className="flex items-center gap-1">
                    {cardPaga && <span className="text-[10px] bg-emerald-500/80 text-white font-bold px-2 py-0.5 rounded-full">Paga ✓</span>}
                    <Icon name="CreditCard" size={24} className="text-white/60" />
                  </div>
                </div>

                <div className="mb-3">
                  <p className="text-white/60 text-xs mb-1">Limite Usado (Total)</p>
                  <p className="text-white font-black text-2xl">{fmt(c.limite_usado)}</p>
                </div>

                <div className="h-1.5 bg-white/20 rounded-full overflow-hidden mb-1">
                  <div className={`h-full rounded-full transition-all ${usedPct > 80 ? 'bg-red-400' : 'bg-white/80'}`} style={{ width: `${Math.min(usedPct, 100)}%` }} />
                </div>
                <div className="flex justify-between text-white/60 text-xs">
                  <span>{fmt(c.limite_usado)} usado</span>
                  <span>{fmt(c.limite_total - c.limite_usado)} livre</span>
                </div>
              </div>
            );
          })}
        </div>

        <div className="flex justify-center gap-1.5 mt-2">
          {cards.map((_, i) => (
            <button key={i} onClick={() => setSelectedCardIdx(i)}
              className={`rounded-full transition-all ${i === selectedCardIdx ? 'w-4 h-1.5 bg-violet-400' : 'w-1.5 h-1.5 bg-slate-600'}`} />

        </div>
      </div>

      {card && (
        <div className="px-4 space-y-4">

              <div className="flex items-center gap-2">
                <Icon name="Receipt" size={18} className="text-violet-400" />
                <h3 className="text-sm font-bold text-slate-100 capitalize">Fatura de {monthLabel(selectedMonth)}</h3>
              </div>
              {isPaga ? (
                <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1">
                  <Icon name="CheckCircle2" size={13} /> Fatura Paga
                </span>
              ) : (
                <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">
                  Fatura Pendente
                </span>
              )}
            </div>

            <div className="my-3 flex items-baseline justify-between">
              <div>
                <p className="text-xs text-slate-400">Valor da Fatura no Mês</p>
                <p className={`text-2xl font-black ${isPaga ? 'text-emerald-400' : totalFaturaMes > 0 ? 'text-violet-300' : 'text-slate-400'}`}>
                  {fmt(isPaga ? regPaga?.valor_pago || totalFaturaMes : totalFaturaMes)}
                </p>
              </div>

              {isPaga && regPaga?.data_pagamento && (

        message={`Deseja desfazer o pagamento da fatura de ${confirmUndo ? monthLabel(confirmUndo.mes) : ''}? O lançamento de pagamento será removido, as compras voltarão para as despesas e o limite usado do cartão será reajustado.`}

  );

function ToggleRow({ checked, onChange, label, hint }) {
  return (
    <div className="flex items-center gap-3 p-3 bg-slate-800 rounded-xl border border-slate-700">
      <button type="button" onClick={() => onChange(!checked)}
        className={`w-12 h-6 rounded-full transition-colors flex items-center px-0.5 flex-shrink-0 ${checked ? 'bg-emerald-500' : 'bg-slate-600'}`}>
        <div className={`w-5 h-5 bg-white rounded-full transition-transform ${checked ? 'translate-x-6' : ''}`} />
      </button>
      <div>
        <p className="text-sm text-slate-300">{label}</p>
        {hint && <p className="text-xs text-slate-500 mt-0.5">{hint}</p>}
      </div>
    </div>
  );
}

function FrequencyPicker({ value, onChange, accent = 'bg-violet-600' }) {
  const opts = [{ id: 'Única', label: 'Só no mês' }, { id: 'Mensal Recorrente', label: 'Todo mês' }];
  return (
    <div className="flex rounded-xl overflow-hidden border border-slate-700">
      {opts.map(o => (
        <button key={o.id} type="button" onClick={() => onChange(o.id)}
          className={`flex-1 py-2.5 text-sm font-semibold transition-colors ${value === o.id ? `${accent} text-white` : 'bg-slate-800 text-slate-400'}`}>
          {o.label}
        </button>
      ))}
    </div>
  );
}

function IncomeModal({ open, onClose, item }) {
  const { addItem, editItem, selectedMonth } = useApp();
  const [form, setForm] = useState({});
  useEffect(() => {
    setForm(item || { descricao: '', valor: '', categoria: 'outros', frequencia: 'Única', data_recebimento: defaultDateForMonth(selectedMonth), recebido: false });
  }, [item, open]);

  const isEditing = !!item?.id;
  const mesRef = form.data_recebimento ? monthKey(form.data_recebimento) : null;

  const handleSave = () => {
    const valor = parseFloat(form.valor);
    if (!Number.isFinite(valor) || !form.data_recebimento) return;
    const rec = { ...form, valor, descricao: (form.descricao || '').trim() || 'Receita', frequencia: form.frequencia || 'Única' };
    if (isEditing) {
      editItem('receitas', rec);
    } else {
      const id = uid();
      addItem('receitas', { ...rec, id, recebido: false });
      if (form.recebido) addItem('receitas_mes', { receita_id: id, mes: monthKey(form.data_recebimento), recebido: true, valor_recebido: valor });
    }
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} title={isEditing ? 'Editar Receita' : 'Nova Receita'}>
      <div className="p-5 space-y-4">
        <Field label="Descrição"><Input value={form.descricao || ''} onChange={e => setForm(f => ({ ...f, descricao: e.target.value }))} placeholder="Ex: Salário, Freelance" /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Valor (R$)"><Input type="number" step="0.01" value={form.valor || ''} onChange={e => setForm(f => ({ ...f, valor: e.target.value }))} placeholder="0,00" /></Field>
          <Field label="Data">
            <Input type="date" value={form.data_recebimento || ''} onChange={e => setForm(f => ({ ...f, data_recebimento: e.target.value }))} />
          </Field>
        </div>
        <Field label="Repetição">
          <FrequencyPicker accent="bg-emerald-600" value={form.frequencia || 'Única'} onChange={v => setForm(f => ({ ...f, frequencia: v }))} />
          {mesRef && (
            <p className="text-xs text-slate-500 mt-1.5">
              {form.frequencia === 'Mensal Recorrente'
                ? `Aparece em ${monthLabel(mesRef)} e em todos os meses seguintes`
                : `Aparece só em ${monthLabel(mesRef)}`}
            </p>
          )}
        </Field>
        {!isEditing && (
          <ToggleRow checked={!!form.recebido} onChange={v => setForm(f => ({ ...f, recebido: v }))} label="Já recebido" />
        )}
        <button onClick={handleSave} className="w-full py-3 rounded-xl bg-emerald-600 text-white font-semibold text-sm active:scale-95 transition-transform">
          {isEditing ? 'Salvar' : 'Adicionar Receita'}
        </button>
      </div>
    </Modal>
  );
}

function FixedExpenseModal({ open, onClose, item }) {
  const { addItem, editItem, selectedMonth } = useApp();

  useEffect(() => {
    setForm(item || { descricao: '', valor: '', categoria: 'moradia', dia_vencimento: 10, forma_pagamento: 'debito', frequencia: 'Única', mes_inicio: selectedMonth, pago: false });

  const frequencia = form.frequencia || 'Mensal Recorrente';

  const handleSave = () => {
    const valor = parseFloat(form.valor);

    if ((frequencia === 'Única' || !isEditing) && !form.mes_inicio) return;
    const rec = {
      ...form,
      valor,
      frequencia,
      dia_vencimento: parseInt(form.dia_vencimento) || 1,
      mes_inicio: form.mes_inicio || undefined,
      descricao: (form.descricao || '').trim() || 'Despesa',
    };
    delete rec.pago;
    delete rec.registro;
    if (isEditing) {
      editItem('despesas_fixas', rec);
    } else {
      const id = uid();
      addItem('despesas_fixas', { ...rec, id });
      if (form.pago) addItem('despesas_fixas_mes', { despesa_id: id, mes: rec.mes_inicio, pago: true, valor_pago: valor });

  return (
    <Modal open={open} onClose={onClose} title={isEditing ? 'Editar Despesa' : 'Nova Despesa'}>

        <div className="grid grid-cols-2 gap-3">
          <Field label="Valor (R$)"><Input type="number" step="0.01" value={form.valor || ''} onChange={e => setForm(f => ({ ...f, valor: e.target.value }))} placeholder="0,00" /></Field>
          <Field label="Dia Vencimento"><Input type="number" min="1" max="31" value={form.dia_vencimento || ''} onChange={e => setForm(f => ({ ...f, dia_vencimento: e.target.value }))} placeholder="10" /></Field>
        </div>
        <Field label="Repetição">
          <FrequencyPicker accent="bg-amber-600" value={frequencia} onChange={v => setForm(f => ({ ...f, frequencia: v }))} />
        </Field>
        <Field label={frequencia === 'Única' ? 'Mês da despesa' : 'A partir de'}>
          <Input type="month" value={form.mes_inicio || ''} onChange={e => setForm(f => ({ ...f, mes_inicio: e.target.value }))} />
          <p className="text-xs text-slate-500 mt-1.5">
            {!form.mes_inicio
              ? 'Sem mês definido: aparece em todos os meses'
              : frequencia === 'Única'
                ? `Aparece só em ${monthLabel(form.mes_inicio)}`
                : `Aparece em ${monthLabel(form.mes_inicio)} e em todos os meses seguintes`}
          </p>
        </Field>
        <Field label="Categoria">
          <div className="flex flex-wrap gap-2 mt-1">
            {CATEGORIES.map(cat => (
              <button key={cat.id} onClick={() => setForm(f => ({ ...f, categoria: cat.id }))}
                className={`flex items-center gap-1 px-2.5 py-1 rounded-full text-xs border transition-all
                  ${form.categoria === cat.id ? 'bg-amber-600 border-amber-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                <Icon name={cat.icon} size={10} /> {cat.label}
              </button>
            ))}
          </div>
        </Field>
        <Field label="Forma de Pagamento">
          <Select value={form.forma_pagamento || 'debito'} onChange={e => setForm(f => ({ ...f, forma_pagamento: e.target.value }))}>
            {PAYMENT_METHODS.map(pm => <option key={pm.id} value={pm.id}>{pm.label}</option>)}
          </Select>
        </Field>
        {!isEditing && (
          <ToggleRow checked={!!form.pago} onChange={v => setForm(f => ({ ...f, pago: v }))} label="Já pago" />
        )}
        <button onClick={handleSave} className="w-full py-3 rounded-xl bg-amber-600 text-white font-semibold text-sm active:scale-95 transition-transform">
          {isEditing ? 'Salvar' : 'Adicionar Despesa'}
        </button>

function FixedExpensesScreen() {
  const { data, editItem, deleteItem, addItem, update, computeds, selectedMonth, setSelectedMonth } = useApp();
  const [tab, setTab] = useState('despesas');
  const [modal, setModal] = useState(null);
  const [payingExpense, setPayingExpense] = useState(null);
  const [receivingIncome, setReceivingIncome] = useState(null);
  const [deleting, setDeleting] = useState(null);

  const receitasMes = computeds.receitasMes;
  const despesasMes = computeds.despesasFixasMes;
  const totalReceitaPrev = computeds.totalReceitaPrevista;
  const totalReceitaRec = computeds.totalReceitaRecebida;
  const totalFixas = computeds.totalFixasPrevisto;
  const totalFixasPagas = computeds.totalFixasPagas;

  const freqLabel = (f) => (f === 'Única' ? 'Só no mês' : 'Todo mês');
  const pmLabel = (id) => PAYMENT_METHODS.find(p => p.id === id)?.label || id;

  const toggleReceita = (r) => {
    if (!r.registro?.recebido) {
      const stored = (data.receitas_mes || []).find(x => x.receita_id === r.id && x.mes === selectedMonth);
      setReceivingIncome({ ...r, _storedRegistro: stored });
      return;
    }
    const record = (data.receitas_mes || []).find(x => x.receita_id === r.id && x.mes === selectedMonth);
    if (record) editItem('receitas_mes', { ...record, recebido: false });
    else addItem('receitas_mes', { receita_id: r.id, mes: selectedMonth, recebido: false, valor_recebido: r.registro.valor_recebido ?? r.valor });
  };
  const toggleDespesa = (d) => {
    if (!d.registro?.pago) {
      setPayingExpense(d);
      return;
    }
    const record = (data.despesas_fixas_mes || []).find(x => x.despesa_id === d.id && x.mes === selectedMonth);
    if (record) editItem('despesas_fixas_mes', { ...record, pago: false });
    else addItem('despesas_fixas_mes', { despesa_id: d.id, mes: selectedMonth, pago: false, valor_pago: d.valor });
  };

  const deletingRecurring = !!deleting && (
    deleting.kind === 'receita'
      ? deleting.item.frequencia === 'Mensal Recorrente'
      : deleting.item.frequencia !== 'Única'
  );
  const monthRecordKey = (kind) => (kind === 'receita' ? 'receitas_mes' : 'despesas_fixas_mes');
  const itemKey = (kind) => (kind === 'receita' ? 'receitas' : 'despesas_fixas');
  const recordOwner = (kind) => (kind === 'receita' ? 'receita_id' : 'despesa_id');

  const removeThisMonth = () => {
    const { kind, item } = deleting;
    const raw = data[itemKey(kind)].find(x => x.id === item.id);
    if (raw) editItem(itemKey(kind), { ...raw, meses_excluidos: [...(raw.meses_excluidos || []), selectedMonth] });
    update(monthRecordKey(kind), arr => (arr || []).filter(x => !(x[recordOwner(kind)] === item.id && x.mes === selectedMonth)));
    setDeleting(null);
  };
  const removeAll = () => {
    const { kind, item } = deleting;
    deleteItem(itemKey(kind), item.id);
    update(monthRecordKey(kind), arr => (arr || []).filter(x => x[recordOwner(kind)] !== item.id));
    setDeleting(null);
  };

  return (
    <div className="pb-28 pt-4 px-4">
      <div className="flex items-center justify-between mb-5">
        <div>
          <h1 className="text-lg font-bold text-slate-100">Receitas e despesas</h1>
          <p className="text-xs text-slate-500 capitalize mt-0.5">{monthLabel(selectedMonth)}</p>
        </div>
        <button onClick={() => setModal({ kind: tab === 'despesas' ? 'despesa' : 'receita', item: null })}
          className="px-3 py-1.5 bg-violet-600/20 border border-violet-500/30 text-violet-400 rounded-xl text-xs font-semibold">
          + {tab === 'despesas' ? 'Nova despesa' : 'Nova receita'}
        </button>
      </div>

      <div className="mb-4">
        <MonthSelector value={selectedMonth} onChange={setSelectedMonth} />
      </div>

      <div className="relative bg-slate-800/60 rounded-xl p-1 flex mb-5 border border-slate-700/50">
        <div className="absolute inset-y-1 bg-slate-700 rounded-lg transition-all duration-200" style={{ width: 'calc(50% - 4px)', left: tab === 'despesas' ? '4px' : 'calc(50%)' }} />
        <button onClick={() => setTab('despesas')} className={`relative flex-1 py-2 text-sm font-semibold rounded-lg z-10 transition-colors ${tab === 'despesas' ? 'text-amber-400' : 'text-slate-500'}`}>
          Despesas
        </button>
        <button onClick={() => setTab('receitas')} className={`relative flex-1 py-2 text-sm font-semibold rounded-lg z-10 transition-colors ${tab === 'receitas' ? 'text-emerald-400' : 'text-slate-500'}`}>
          Receitas
        </button>
      </div>

      {tab === 'despesas' ? (
        <div className="grid grid-cols-2 gap-3 mb-5">
          <Card><p className="text-xs text-slate-400 mb-1">Total Previsto</p><p className="text-lg font-bold text-amber-400">{fmt(totalFixas)}</p></Card>

              <div className="w-8 h-8 bg-emerald-500/10 rounded-xl flex items-center justify-center flex-shrink-0">
                <Icon name="TrendingUp" size={14} className="text-emerald-400" />
              </div>
              <div className="flex-1 min-w-0">
                <p className={`text-sm font-medium ${r.registro?.recebido ? 'line-through text-slate-500' : 'text-slate-200'}`}>{r.descricao}</p>
                <p className="text-xs text-slate-500">{r.frequencia === 'Mensal Recorrente' ? `${monthLabel(selectedMonth)} · ${freqLabel(r.frequencia)}` : `${new Date(r.data_recebimento + 'T12:00:00').toLocaleDateString('pt-BR')} · ${freqLabel(r.frequencia)}`}</p>

              <div className="text-right flex-shrink-0">
                <p className="text-sm font-bold text-emerald-400">{fmt(r.registro?.recebido ? (r.registro.valor_recebido ?? r.valor) : r.valor)}</p>
                <div className="flex gap-1 justify-end mt-1">

          {receitasMes.length === 0 && (

      <FixedExpenseModal open={modal?.kind === 'despesa'} onClose={() => setModal(null)} item={modal?.kind === 'despesa' ? modal.item : null} />
      <IncomeModal open={modal?.kind === 'receita'} onClose={() => setModal(null)} item={modal?.kind === 'receita' ? modal.item : null} />

      <IncomeMonthModal open={!!receivingIncome} onClose={() => setReceivingIncome(null)} item={receivingIncome} month={selectedMonth} />

      <ConfirmDialog open={!!deleting && !deletingRecurring} message={`Excluir "${deleting?.item?.descricao}"?`} onConfirm={removeAll} onCancel={() => setDeleting(null)} />

  );
}

function InvestmentModal({ open, onClose, item }) {
  const { addItem, editItem } = useApp();
  const [form, setForm] = useState({});
  useEffect(() => {
    setForm(item || { nome: '', tipo: 'reserva', valor_atual: '', meta_valor: '', rentabilidade_mensal: '' });
  }, [item, open]);
  const handleSave = () => {
    const rec = { ...form, valor_atual: parseFloat(form.valor_atual), meta_valor: parseFloat(form.meta_valor || 0), rentabilidade_mensal: parseFloat(form.rentabilidade_mensal || 0) };
    if (item?.id) editItem('investimentos', rec);
    else addItem('investimentos', rec);
    onClose();
  };
  return (
    <Modal open={open} onClose={onClose} title={item?.id ? 'Editar Investimento' : 'Novo Investimento'}>
      <div className="p-5 space-y-4">
        <Field label="Nome"><Input value={form.nome || ''} onChange={e => setForm(f => ({ ...f, nome: e.target.value }))} placeholder="Ex: Tesouro Direto, Bitcoin" /></Field>
        <Field label="Tipo">
          <Select value={form.tipo || 'reserva'} onChange={e => setForm(f => ({ ...f, tipo: e.target.value }))}>
            {INVEST_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
          </Select>
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Valor Atual (R$)"><Input type="number" step="0.01" value={form.valor_atual || ''} onChange={e => setForm(f => ({ ...f, valor_atual: e.target.value }))} placeholder="0,00" /></Field>
          <Field label="Meta (R$)"><Input type="number" step="0.01" value={form.meta_valor || ''} onChange={e => setForm(f => ({ ...f, meta_valor: e.target.value }))} placeholder="0,00" /></Field>
        </div>
        <Field label="Rentabilidade Mensal (%)"><Input type="number" step="0.01" value={form.rentabilidade_mensal || ''} onChange={e => setForm(f => ({ ...f, rentabilidade_mensal: e.target.value }))} placeholder="0,00" /></Field>
        <button onClick={handleSave} className="w-full py-3 rounded-xl bg-violet-600 text-white font-semibold text-sm active:scale-95 transition-transform">
          {item?.id ? 'Salvar' : 'Adicionar'}
        </button>
      </div>
    </Modal>
  );
}

function AporteModal({ open, onClose, investimento }) {
  const { addItem, editItem, selectedMonth } = useApp();
  const [tipo, setTipo] = useState('aporte');
  const [valor, setValor] = useState('');
  const [data, setData] = useState('');
  const [lancarInicio, setLancarInicio] = useState(true);
  useEffect(() => {
    setValor('');
    setLancarInicio(true);
    setData(defaultDateForMonth(selectedMonth));
  }, [investimento, open, selectedMonth]);

  const handleSave = () => {
    const amount = parseFloat(valor);
    if (!Number.isFinite(amount) || amount <= 0 || !data || !investimento || (tipo === 'resgate' && amount > investimento.valor_atual)) return;
    const delta = tipo === 'aporte' ? amount : -amount;
    const novo = { ...investimento, valor_atual: Math.max(0, investimento.valor_atual + delta) };
    editItem('investimentos', novo);
    addItem('lancamentos_investimento', { investimento_id: investimento.id, investimento_nome: investimento.nome, tipo, valor: amount, data, lancar_inicio: lancarInicio });
    onClose();
    setValor('');
  };
  return (
    <Modal open={open} onClose={onClose} title={`${tipo === 'aporte' ? 'Aporte' : 'Resgate'} – ${investimento?.nome || ''}`}>
      <div className="p-5 space-y-4">
        <div className="flex rounded-xl overflow-hidden border border-slate-700">
          {['aporte','resgate'].map(t => (
            <button key={t} onClick={() => setTipo(t)}
              className={`flex-1 py-2.5 text-sm font-semibold transition-colors capitalize ${tipo === t ? (t === 'aporte' ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white') : 'bg-slate-800 text-slate-400'}`}>{t.charAt(0).toUpperCase() + t.slice(1)}</button>
          ))}
        </div>
        <Field label="Valor (R$)">
          <Input type="number" step="0.01" value={valor} onChange={e => setValor(e.target.value)} placeholder="0,00" />
        </Field>
        <Field label="Data">
          <Input type="date" value={data} onChange={e => setData(e.target.value)} />
        </Field>
        <ToggleRow
          checked={lancarInicio}
          onChange={setLancarInicio}
          label="Lançar na tela inicial"
          hint={tipo === 'aporte' ? 'Aparece nas transações e desconta do balanço do mês' : 'Aparece nas transações e soma no balanço do mês'}
        />
        <button onClick={handleSave} disabled={!valor || (tipo === 'resgate' && parseFloat(valor) > (investimento?.valor_atual || 0))} className={`w-full py-3 rounded-xl text-white font-semibold text-sm active:scale-95 transition-transform disabled:opacity-40 ${tipo === 'aporte' ? 'bg-emerald-600' : 'bg-rose-600'}`}>
          Confirmar {tipo === 'aporte' ? 'Aporte' : 'Resgate'}
        </button>
      </div>
    </Modal>
  );
}

function InvestmentsScreen() {
  const { data, deleteItem, computeds, selectedMonth, setSelectedMonth, removeLancamentoInvestimento } = useApp();
  const [deletingLancId, setDeletingLancId] = useState(null);
  const [editInv, setEditInv] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [aportando, setAportando] = useState(null);
  const [deletingId, setDeletingId] = useState(null);

  const { investimentos } = data;
  const totalInvestido = investimentos.reduce((s, i) => s + i.valor_atual, 0);

  const byType = INVEST_TYPES.map(t => ({
    ...t,
    value: investimentos.filter(i => i.tipo === t.id).reduce((s, i) => s + i.valor_atual, 0),
  })).filter(t => t.value > 0);

  const rendimentoTotal = investimentos.reduce((s, i) => s + (i.valor_atual * i.rentabilidade_mensal / 100), 0);

  return (
    <div className="pb-28 pt-4 px-4">
      <div className="flex items-center justify-between mb-5">
        <h1 className="text-lg font-bold text-slate-100">Investimentos</h1>
        <button onClick={() => setShowAdd(true)} className="px-3 py-1.5 bg-violet-600/20 border border-violet-500/30 text-violet-400 rounded-xl text-xs font-semibold">+ Novo</button>
      </div>

      <div className="mb-4"><MonthSelector value={selectedMonth} onChange={setSelectedMonth} /></div>

      <div className="grid grid-cols-2 gap-3 mb-5">
        <Card><p className="text-xs text-slate-400 mb-1">Aportes no mês</p><p className="text-base font-bold text-emerald-400">{fmt(computeds.totalAportesMes)}</p></Card>
        <Card><p className="text-xs text-slate-400 mb-1">Resgates no mês</p><p className="text-base font-bold text-rose-400">{fmt(computeds.totalResgatesMes)}</p></Card>
      </div>

      <div className="relative overflow-hidden rounded-2xl p-5 mb-5" style={{ background: 'linear-gradient(135deg, #1e1b4b, #0f172a)', border: '1px solid rgba(139,92,246,0.25)' }}>
        <div className="absolute top-0 right-0 w-32 h-32 rounded-full opacity-10" style={{ background: 'radial-gradient(circle, #8b5cf6, transparent)', transform: 'translate(30%,-30%)' }} />
        <p className="text-xs text-slate-400 uppercase tracking-widest mb-1">Patrimônio Investido</p>
        <p className="text-3xl font-black text-white mb-2">{fmt(totalInvestido)}</p>
        <div className="flex gap-3 text-xs">
          <div className="flex items-center gap-1"><Icon name="TrendingUp" size={12} className="text-emerald-400" /><span className="text-emerald-400 font-semibold">+{fmt(rendimentoTotal)}/mês estimado</span></div>
        </div>
      </div>

      {byType.length > 0 && (
        <Card className="mb-5">
          <h3 className="text-sm font-bold text-slate-200 mb-4">Distribuição por Tipo</h3>
          <div className="flex items-center gap-5">
            <DonutChart data={byType} size={140} strokeWidth={22} />
            <div className="flex-1 space-y-2">
              {byType.map(t => (
                <div key={t.id} className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: t.color }} />
                    <span className="text-xs text-slate-400">{t.label}</span>
                  </div>
                  <span className="text-xs font-semibold text-slate-200">{((t.value / totalInvestido) * 100).toFixed(0)}%</span>
                </div>
              ))}
            </div>
          </div>
        </Card>
      )}

      <div className="space-y-3">
        {investimentos.map(inv => {
          const tipo = INVEST_MAP[inv.tipo] || { label: inv.tipo, color: '#8b5cf6' };
          const prog = inv.meta_valor > 0 ? (inv.valor_atual / inv.meta_valor) * 100 : 0;
          const rend = inv.valor_atual * inv.rentabilidade_mensal / 100;
          const isPos = inv.rentabilidade_mensal >= 0;
          return (
            <Card key={inv.id}>
              <div className="flex items-start justify-between mb-3">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-xl flex items-center justify-center" style={{ background: `${tipo.color}20` }}>
                    <div className="w-3 h-3 rounded-full" style={{ background: tipo.color }} />
                  </div>
                  <div>
                    <p className="text-sm font-semibold text-slate-200">{inv.nome}</p>
                    <p className="text-xs text-slate-500">{tipo.label}</p>
                  </div>
                </div>
                <div className="text-right">
                  <p className="text-base font-black text-slate-100">{fmt(inv.valor_atual)}</p>
                  <p className={`text-xs font-semibold ${isPos ? 'text-emerald-400' : 'text-rose-400'}`}>{isPos ? '+' : ''}{fmtPct(inv.rentabilidade_mensal)}/mês</p>
                </div>
              </div>

              {inv.meta_valor > 0 && (
                <div className="mb-3">
                  <div className="flex justify-between text-xs text-slate-500 mb-1"><span>Meta: {fmt(inv.meta_valor)}</span><span>{prog.toFixed(0)}%</span></div>
                  <div className="h-1.5 bg-slate-700/50 rounded-full overflow-hidden">
                    <div className="h-full rounded-full transition-all duration-500" style={{ width: `${Math.min(prog, 100)}%`, background: tipo.color }} />
                  </div>
                </div>
              )}

              <div className="flex items-center justify-between">
                <div className="flex gap-2">
                  <button onClick={() => setAportando(inv)}
                    className="px-3 py-1.5 bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 text-xs font-semibold rounded-lg active:scale-95">
                    Aporte/Resgate
                  </button>
                  <button onClick={() => setEditInv(inv)} className="px-3 py-1.5 bg-slate-700/50 text-slate-400 text-xs font-semibold rounded-lg active:scale-95">
                    Editar
                  </button>
                </div>
                <div className="flex items-center gap-1 text-xs">
                  <Icon name={isPos ? 'TrendingUp' : 'TrendingDown'} size={12} className={isPos ? 'text-emerald-400' : 'text-rose-400'} />
                  <span className={isPos ? 'text-emerald-400' : 'text-rose-400'}>{isPos ? '+' : ''}{fmt(rend)}</span>
                  <button onClick={() => setDeletingId(inv.id)} className="ml-2 text-slate-600 hover:text-rose-400"><Icon name="Trash2" size={12} /></button>
                </div>
              </div>
            </Card>
          );
        })}
      </div>

      {computeds.lancamentosInvestimentoMes.length > 0 && (
        <div className="mt-5">
          <h3 className="text-sm font-bold text-slate-200 mb-3">Movimentações do mês</h3>
          <Card className="p-0 overflow-hidden">
            <div className="px-4">
              {computeds.lancamentosInvestimentoMes.slice().sort((a, b) => b.data.localeCompare(a.data)).map(l => {
                const nome = investimentos.find(i => i.id === l.investimento_id)?.nome || l.investimento_nome || 'Investimento';
                const isAporte = l.tipo === 'aporte';
                return (
                  <div key={l.id} className="flex items-center gap-3 py-3 border-b border-slate-700/30 last:border-0">
                    <div className={`w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0 ${isAporte ? 'bg-emerald-500/10' : 'bg-rose-500/10'}`}>
                      <Icon name={isAporte ? 'ArrowUpRight' : 'ArrowDownLeft'} size={15} className={isAporte ? 'text-emerald-400' : 'text-rose-400'} />
                    </div>
                    <div className="flex-1 min-w-0">
                      <p className="text-sm font-medium text-slate-200 truncate">{nome}</p>
                      <p className="text-xs text-slate-500">
                        {new Date(l.data + 'T12:00:00').toLocaleDateString('pt-BR')} · {isAporte ? 'Aporte' : 'Resgate'}{l.lancar_inicio === false ? ' · fora do balanço' : ''}
                      </p>
                    </div>
                    <div className="text-right flex-shrink-0">
                      <p className={`text-sm font-semibold ${isAporte ? 'text-emerald-400' : 'text-rose-400'}`}>{isAporte ? '+' : '-'}{fmt(l.valor)}</p>
                      <button onClick={() => setDeletingLancId(l.id)} className="text-slate-600 hover:text-rose-400 mt-1"><Icon name="Trash2" size={12} /></button>
                    </div>
                  </div>
                );
              })}
            </div>
          </Card>
        </div>
      )}

      <ConfirmDialog open={!!deletingLancId} message="Excluir esta movimentação? O valor será revertido no investimento." onConfirm={() => { removeLancamentoInvestimento(deletingLancId); setDeletingLancId(null); }} onCancel={() => setDeletingLancId(null)} />
      <InvestmentModal open={showAdd} onClose={() => setShowAdd(false)} item={null} />
      <InvestmentModal open={!!editInv} onClose={() => setEditInv(null)} item={editInv} />
      <AporteModal open={!!aportando} onClose={() => setAportando(null)} investimento={aportando} />
      <ConfirmDialog open={!!deletingId} message="Excluir este investimento?" onConfirm={() => { deleteItem('investimentos', deletingId); setDeletingId(null); }} onCancel={() => setDeletingId(null)} />
    </div>
  );
}

              <p className="font-semibold">Importar JSON</p>
              <p className="text-xs text-slate-500">Restaurar backup</p>
            </div>
          </button>
          <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={e => { if (e.target.files[0]) { importData(e.target.files[0]); e.target.value = ''; } }} />
        </div>
      </Card>

      <Card>
        <h3 className="text-sm font-bold text-slate-200 mb-4">Resumo dos Dados</h3>
        <div className="space-y-2.5">
          {[
            { label: 'Transações', count: data.transacoes.length, icon: 'ArrowLeftRight', color: 'text-blue-400' },
            { label: 'Receitas', count: data.receitas.length, icon: 'TrendingUp', color: 'text-emerald-400' },
            { label: 'Despesas Fixas', count: data.despesas_fixas.length, icon: 'Receipt', color: 'text-amber-400' },
            { label: 'Cartões', count: data.cartoes.length, icon: 'CreditCard', color: 'text-violet-400' },
            { label: 'Investimentos', count: data.investimentos.length, icon: 'BarChart3', color: 'text-pink-400' },
            { label: 'Faturas Pagas', count: (data.faturas_pagas || []).length, icon: 'CheckCircle2', color: 'text-emerald-400' },
          ].map(item => (
            <div key={item.label} className="flex items-center justify-between py-1">
              <div className="flex items-center gap-2.5">
                <Icon name={item.icon} size={14} className={item.color} />
                <span className="text-sm text-slate-400">{item.label}</span>
              </div>
              <span className="text-sm font-semibold text-slate-200">{item.count} {item.count === 1 ? 'item' : 'itens'}</span>
            </div>
          ))}
        </div>
      </Card>

      <div className="text-center pt-2 pb-4">
        <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-violet-600 to-emerald-600 flex items-center justify-center mx-auto mb-2">
          <Icon name="Wallet" size={22} className="text-white" />
        </div>
        <p className="text-sm font-bold text-slate-200">FinanAPP</p>
        <p className="text-xs text-slate-500">v1.1.0 · Controle Financeiro Pessoal</p>
        <p className="text-xs text-slate-600 mt-1">Dados armazenados localmente no seu dispositivo</p>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// BOTTOM NAVIGATION
// ─────────────────────────────────────────────
const NAV_ITEMS = [
  { id: 'dashboard', icon: 'LayoutDashboard', label: 'Início' },
  { id: 'cards', icon: 'CreditCard', label: 'Cartões' },
  { id: 'fixed', icon: 'Receipt', label: 'Receitas' },
  { id: 'investments', icon: 'TrendingUp', label: 'Investir' },
  { id: 'settings', icon: 'Settings', label: 'Config' },
];

function BottomNav({ active, onNavigate, onQuickAdd }) {
  const leftItems  = [NAV_ITEMS[0], NAV_ITEMS[1]];
  const rightItems = [NAV_ITEMS[2], NAV_ITEMS[3], NAV_ITEMS[4]];
  return (
    <div className="fixed bottom-0 left-0 right-0 z-40 flex justify-center">
      <div className="w-full max-w-lg bg-slate-900/95 border-t border-slate-700/50 safe-bottom" style={{ backdropFilter: 'blur(20px)' }}>
        <div className="flex items-center justify-around px-1 pt-2 pb-1 relative">
          {leftItems.map(item => (
            <NavButton key={item.id} item={item} active={active === item.id} onClick={() => onNavigate(item.id)} />
          ))}

          <div className="flex flex-col items-center -mt-6 relative z-10">
            <button onClick={onQuickAdd}
              id="fab-quick-add"
              className="w-14 h-14 rounded-2xl flex items-center justify-center shadow-xl active:scale-90 transition-transform"
              style={{ background: 'linear-gradient(135deg, #059669, #10b981)', boxShadow: '0 4px 24px rgba(16,185,129,0.4)' }}>
              <Icon name="Plus" size={26} className="text-white" strokeWidth={2.5} />
            </button>
            <span className="text-[10px] text-slate-500 mt-1.5 font-medium">Lançar</span>
          </div>

          {rightItems.map(item => (
            <NavButton key={item.id} item={item} active={active === item.id} onClick={() => onNavigate(item.id)} />
          ))}
        </div>
      </div>
    </div>
  );
}

function NavButton({ item, active, onClick }) {
  return (
    <button onClick={onClick} className={`flex flex-col items-center gap-1 px-3 py-1 rounded-xl transition-colors ${active ? 'nav-item-active' : ''}`}>
      <Icon name={item.icon} size={20} className={active ? 'text-violet-400' : 'text-slate-500'} />
      <span className={`text-[10px] font-medium ${active ? 'text-violet-400' : 'text-slate-600'}`}>{item.label}</span>
    </button>
  );
}

// ─────────────────────────────────────────────
// APP ROOT
// ─────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('dashboard');
  const [showQuickAdd, setShowQuickAdd] = useState(false);
  const [showTxModal, setShowTxModal] = useState(false);

  const screenMap = {
    dashboard: <DashboardScreen onAddTransaction={() => setShowTxModal(true)} onNavigate={setScreen} />,
    cards: <CreditCardsScreen />,
    fixed: <FixedExpensesScreen />,
    investments: <InvestmentsScreen />,
    settings: <SettingsScreen />,
  };

  return (
    <AppProvider>
      <div className="min-h-screen bg-slate-950 max-w-lg mx-auto relative">
        <div className="h-safe-top" style={{ height: 'env(safe-area-inset-top, 0px)' }} />

        <div className="overflow-y-auto" style={{ minHeight: '100vh' }}>
          {screenMap[screen]}
        </div>

        <BottomNav active={screen} onNavigate={setScreen} onQuickAdd={() => setShowQuickAdd(true)} />
        <QuickAddModal open={showQuickAdd} onClose={() => setShowQuickAdd(false)} />
        <TransactionModal open={showTxModal} onClose={() => setShowTxModal(false)} item={null} />
      </div>
    </AppProvider>
  );
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
